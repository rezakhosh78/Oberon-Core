name: Release Oberon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, matching version.go (for example, v0.4.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oberon-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve and validate tag name
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH format, such as v0.4.4." >&2
            exit 1
          fi

          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the selected source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify version and existing tag target
        shell: bash
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' version.go)"
          if [[ -z "$version" || "$TAG_NAME" != "v$version" ]]; then
            echo "Release tag $TAG_NAME must match version.go (found $version)." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            tag_commit="$(git rev-parse "$TAG_NAME^{commit}")"
            source_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$source_commit" ]]; then
              echo "Tag $TAG_NAME already points to a different commit." >&2
              exit 1
            fi
          fi

  build:
    name: Build release assets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all supported targets
        run: bash ./scripts/build-matrix.sh "$RUNNER_TEMP/oberon-binaries"

      - name: Package release assets
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: >-
          python3 ./scripts/package-release.py
          --tag "$TAG_NAME"
          --binaries "$RUNNER_TEMP/oberon-binaries"
          --output dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: oberon-release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: oberon-release-assets
          path: dist

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          assets=(oberon-v*.tar.gz oberon-v*.zip oberon-v*-windows-*.exe)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "$asset.sha256"
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Oberon ${{ needs.validate.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
