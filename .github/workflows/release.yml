name: Release Oberon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, matching version.go (for example, v0.4.3)"
        required: true
        type: string
      replace_existing_tag:
        description: "Move an existing tag to this workflow's source commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: oberon-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve and validate tag name
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REPLACE_EXISTING_TAG: ${{ inputs.replace_existing_tag }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH format, such as v0.4.3." >&2
            exit 1
          fi

          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the selected source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify version and existing tag target
        shell: bash
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          REPLACE_EXISTING_TAG: ${{ inputs.replace_existing_tag }}
        run: |
          version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' version.go)"
          if [[ -z "$version" || "$TAG_NAME" != "v$version" ]]; then
            echo "Release tag $TAG_NAME must match version.go (found $version)." >&2
            exit 1
          fi

          remote_tag_oid="$(git ls-remote --refs origin "refs/tags/$TAG_NAME" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$remote_tag_oid" ]]; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            tag_commit="$(git rev-parse "$TAG_NAME^{commit}")"
            source_commit="$(git rev-parse "$SOURCE_SHA^{commit}")"
            if [[ "$tag_commit" != "$source_commit" ]]; then
              if [[ "$REPLACE_EXISTING_TAG" != "true" ]]; then
                echo "Tag $TAG_NAME already points to a different commit." >&2
                echo "For workflow_dispatch, enable 'Move an existing tag' to update it to this source commit, or choose a new version." >&2
                exit 1
              fi

              git push --force-with-lease="refs/tags/$TAG_NAME:$remote_tag_oid" \
                origin "$source_commit:refs/tags/$TAG_NAME"
              echo "Moved tag $TAG_NAME to $source_commit."
            fi
          fi

  build:
    name: Build release assets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all supported targets
        run: bash ./scripts/build-matrix.sh "$RUNNER_TEMP/oberon-binaries"

      - name: Build Android ARM64 CLI
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/oberon-binaries/oberon-android-arm64" .

      - name: Package release assets
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: >-
          python3 ./scripts/package-release.py
          --tag "$TAG_NAME"
          --binaries "$RUNNER_TEMP/oberon-binaries"
          --output dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: oberon-release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: oberon-release-assets
          path: dist

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          assets=(oberon-v*.tar.gz oberon-v*.zip oberon-v*-windows-*.exe)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "$asset.sha256"
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          name: Oberon ${{ needs.validate.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
