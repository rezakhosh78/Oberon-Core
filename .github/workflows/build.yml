name: Build Oberon
on:
  push:
  pull_request:
jobs:
  matrix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: bash ./scripts/build-matrix.sh
      - name: Build Android ARM64 CLI
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/oberon-android-arm64" .
